<!DOCTYPE html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fast Fax Food 騎手</title><style>
*{box-sizing:border-box;margin:0}:root{--r:#e63946;--k:#14181f;--m:#6b7280;--b:#f3f5f7;--l:#e2e6ea}
body{font-family:system-ui,"PingFang HK","Noto Sans TC",sans-serif;background:var(--b);color:var(--k)}
button{border:0;font:inherit;cursor:pointer;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--k);color:#fff;transition:.2s}button:hover{transform:translateY(-1px);box-shadow:0 6px 16px #0003}button:active{transform:scale(.94)}button:disabled{opacity:.5;pointer-events:none}
.rd{background:var(--r)}
input{width:100%;padding:12px;margin:5px 0 10px;border:1px solid var(--l);border-radius:12px;font:inherit;transition:.2s}input:focus{outline:0;border-color:var(--r);box-shadow:0 0 0 4px #e6394622}
@keyframes up{from{opacity:0;transform:translateY(20px)}}@keyframes ts{0%{opacity:0;top:-30px}10%,88%{opacity:1;top:16px}100%{opacity:0;top:-30px}}@keyframes pu{0%{box-shadow:0 0 0 0 #e6394688}100%{box-shadow:0 0 0 14px #e6394600}}@keyframes rd{to{background-position:28px 0}}@keyframes rs{from{left:-50px}to{left:100%}}@keyframes dr{to{background-position:0 12px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);background:var(--k);color:#fff;padding:12px 20px;border-radius:99px;z-index:30;animation:ts 3.2s both;font-weight:600}
#lg{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:var(--k);color:#fff;overflow:hidden;position:relative}
#lg form{width:100%;max-width:320px;animation:up .6s both}#lg h1{font-size:26px;margin:6px 0 4px}#lg p{opacity:.6;margin-bottom:22px}#lg button{width:100%}
.mk{width:52px;height:52px;border-radius:16px;background:var(--r);display:grid;place-items:center;font-weight:900;animation:pu 2s infinite}
.road{position:absolute;left:0;right:0;bottom:12px;height:3px;background:repeating-linear-gradient(90deg,#fff6 0 14px,transparent 14px 28px);animation:rd .5s linear infinite}.rb{position:absolute;bottom:16px;animation:rs 4s linear infinite;color:#fff}
header{background:var(--k);color:#fff;padding:16px 18px 40px;position:relative;overflow:hidden}header .t{display:flex;justify-content:space-between;align-items:center}
.st{display:flex;gap:10px;margin:-22px 14px 0;position:relative}.st div{flex:1;background:#fff;border-radius:16px;padding:12px 14px;border:1px solid var(--l);animation:up .5s both}.st div+div{animation-delay:.1s}.st b{font-size:26px;display:block}.st small{color:var(--m)}
.w{max-width:600px;margin:auto;padding:14px}h3{margin:20px 0 8px;display:flex;align-items:center;gap:8px}h3 i{width:9px;height:9px;border-radius:50%;background:var(--r);animation:pu 1.4s infinite}
.c{background:#fff;border-radius:18px;padding:16px;margin:10px 0;border:1px solid var(--l);animation:up .45s both}.c.n{border-color:var(--r)}
.rt{display:grid;grid-template-columns:16px 1fr;gap:2px 12px;margin:6px 0 12px}.rt s{width:12px;height:12px;border-radius:50%;border:3px solid var(--k);margin-top:3px;text-decoration:none}.rt s.e{background:var(--r);border-color:var(--r)}.rt u{width:2px;margin:0 7px;height:16px;background:repeating-linear-gradient(var(--m) 0 4px,transparent 4px 8px);animation:dr .6s linear infinite}
small{color:var(--m)}a{color:var(--r);font-weight:700;text-decoration:none}.es{text-align:center;color:var(--m);padding:26px 0}
.pr{display:inline-block;background:#e63946;color:#fff;border-radius:99px;padding:3px 10px;font-size:13px;font-weight:700;margin-bottom:8px}
</style></head><body>
<div id=lg><form onsubmit="return go(event)"><div class=mk>FFF</div><h1>騎手端</h1><p>登入後開始接單</p><input id=u placeholder=騎手帳號 autocomplete=username><input id=p type=password placeholder=密碼 autocomplete=current-password><button class=rd>上線</button></form><div class=road></div><svg class=rb width=30 height=30 viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2.2 stroke-linecap=round stroke-linejoin=round><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17l4-8h4l4 8M10 9H8"/></svg></div>
<div id=ap hidden></div>
<script type=module>
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,updateDoc,doc,onSnapshot,runTransaction,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const db=getFirestore(initializeApp({apiKey:"AIzaSyDE5ph-uHazh6m0Q4ENeGirLHEI59Cpfhw",authDomain:"uspp1-cd038.firebaseapp.com",projectId:"uspp1-cd038",storageBucket:"uspp1-cd038.firebasestorage.app",messagingSenderId:"118206137592",appId:"1:118206137592:web:00879c764b12eb2e25270d"}));
const $=i=>document.getElementById(i),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),F=10,P={},
toast=t=>{const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),3300)},
beep=()=>{try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.2,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.4);o.start();o.stop(c.currentTime+.4)}catch{}},
cu=()=>document.querySelectorAll("[data-n]").forEach(e=>{const k=e.dataset.k,n=+e.dataset.n,f0=P[k]??0,t0=performance.now();P[k]=n;const f=t=>{const x=Math.min(1,(t-t0)/700);e.textContent=Math.round(f0+(n-f0)*x);x<1&&requestAnimationFrame(f)};requestAnimationFrame(f)});
let U=localStorage.ffr||null,R=[],O=[],seen=null,ld=0;
const me=()=>R.find(x=>x.id==U);
onSnapshot(collection(db,"riders"),s=>{R=s.docs.map(d=>({id:d.id,...d.data()}));ld=1;if(U&&!me()){U=null;localStorage.removeItem("ffr");location.reload()}else if(U)show();U&&draw()});
onSnapshot(collection(db,"orders"),s=>{O=s.docs.map(d=>({id:d.id,...d.data()}));const a=new Set(O.filter(o=>o.status=="ready"&&!o.rid).map(o=>o.id));
if(seen&&U&&[...a].some(i=>!seen.has(i))){toast("有新訂單可接");beep()}seen=a;U&&draw()});
const show=()=>{$("lg").hidden=1;$("ap").hidden=0};
window.go=e=>{e.preventDefault();if(!ld)return toast("載入中,請稍候"),false;const r=R.find(x=>x.user==$("u").value.trim()&&x.pass==$("p").value);if(!r)return toast("帳號或密碼錯誤"),false;U=r.id;localStorage.ffr=U;show();draw();return false};
window.out=()=>{localStorage.removeItem("ffr");location.reload()};
window.take=async id=>{try{await runTransaction(db,async t=>{const r=doc(db,"orders",id),s=await t.get(r),d=s.data();if(d.status!="ready"||d.rid)throw 0;t.update(r,{status:"delivering",rid:U,rn:me().name})});toast("接單成功")}catch{toast("此訂單已被其他騎手接走")}};
window.fin=id=>confirm("確認已送達客戶?")&&updateDoc(doc(db,"orders",id),{status:"done",dt:serverTimestamp()}).then(()=>toast("已完成,收入 +$"+F));
const oc=(o,b,c,i)=>`<div class="c ${c||""}" style="animation-delay:${i*.07}s">${c?`<span class=pr>+$${F}</span>`:""}<div class=rt><s></s><div><b>${esc(o.mn)}</b><br><small>取餐</small></div><u></u><span></span><s class=e></s><div><b>${esc(o.ad)}</b><br><small>送餐</small></div></div><small>${o.items.map(x=>esc(x.n)+" × "+x.q).join("、")}<br>客戶 ${esc(o.cn)} · <a href="tel:${esc(o.ph)}">${esc(o.ph)}</a></small><div style="margin-top:12px">${b}</div></div>`;
function draw(){const r=me();if(!r)return;const av=O.filter(o=>o.status=="ready"&&!o.rid),mine=O.filter(o=>o.rid==U&&o.status=="delivering"),n=O.filter(o=>o.rid==U&&o.status=="done").length;
$("ap").innerHTML=`<header><div class=t><div><small style="color:#fff9">已上線</small><br><b style="font-size:20px">${esc(r.name)}</b></div><button class=rd onclick=out() style="padding:8px 14px">下線</button></div><div class=road></div></header><div class=st><div><b data-n=${n} data-k=n>0</b><small>已完成單數</small></div><div><b>$<span data-n=${n*F} data-k=e>0</span></b><small>累計收入</small></div></div><div class=w><h3>配送中 (${mine.length})</h3>`+(mine.map((o,i)=>oc(o,`<button class=rd style="width:100%" onclick="fin('${o.id}')">確認送達</button>`,"",i)).join("")||`<div class=es>目前沒有進行中的訂單</div>`)+`<h3><i></i>可接訂單 (${av.length})</h3>`+(av.map((o,i)=>oc(o,`<button style="width:100%" onclick="take('${o.id}')">接單</button>`,"n",i)).join("")||`<div class=es>等待餐廳出餐,新訂單會即時顯示</div>`)+"</div>";cu()}
if(U)show();
</script></body></html>
